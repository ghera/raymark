plugins {
    id 'com.android.application'
    id 'com.diffplug.spotless'
}

// Updates a file during compilation
// Used to replace instances of 'com.raylib.raymob'
def updateFile(filePath, toReplace, replacement) {
    def file = file(filePath)
    def modifiedContent = file.text.replaceAll(toReplace, replacement)
    file.write(modifiedContent)
}

// Checks if one or more values in a set
// of properties in gradle.properties are true
def isAtLeastOnePropertyTrueForPrefix(String prefix) {
    def properties = project.properties
    return properties.any { key, value ->
        key.startsWith(prefix) && value == 'true'
    }
}

// Returns the hexadecimal code of the desired OpenGL version
// Used to retrieve the code to write in the AndroidManifest.xml
static def getGLVersionCode(String version) {
    def versionCodes = [
            'ES20': '0x00020000',
            'ES30': '0x00030000',
            'ES31': '0x00030001',
            'ES32': '0x00030002'
    ]
    if (!versionCodes.containsKey(version)) {
        throw new IllegalArgumentException("Version '${version}' is not valid. Valid versions are: ${versionCodes.keySet()}")
    }
    return versionCodes[version]
}

def appId = project.properties['app.application_id'] as String
def libName = project.properties['app.native_library_name'] as String
def appIdPath = appId.replace(".", "/")

configurations.configureEach {
    resolutionStrategy.force "androidx.annotation:annotation:1.9.1"
}

tasks.register("cleanResources") {
    doLast {
        def targetDir = file("${projectDir}/src/main/assets/resources")
        if (targetDir.exists()) {
            targetDir.eachFile { it.deleteDir() ?: it.delete() }
        }
    }
}

tasks.register("copySharedAssets", Copy) {
    def assetsDir = file("${projectDir}/src/main/assets/resources")

    doFirst {
        if (assetsDir.exists()) {
            assetsDir.eachFile { it.deleteDir() ?: it.delete() }
        }
    }

    from("../../desktop/resources")
    into(assetsDir)
}

def keyPropertiesFile = file("${System.getProperty('user.home')}/.android/credentials")
def keyProperties = new Properties()
if (keyPropertiesFile.exists()) {
    keyProperties.load(new FileInputStream(keyPropertiesFile))
}

android {
    namespace = project.properties['app.application_id']
    compileSdk 36
    ndkVersion = "26.3.11579264"

    signingConfigs {
        release {
            if (keyPropertiesFile.exists()) {
                storeFile file(keyProperties['storeFile'])
                storePassword keyProperties['storePassword']
                keyAlias keyProperties['keyAlias']
                keyPassword keyProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        minSdk 31
        targetSdk 36

        applicationId project.properties['app.application_id']
        versionCode Integer.parseInt(project.properties['app.version_code'])
        versionName project.properties['app.version_name']

        // Defining the application name label (to the resources)
        resValue "string", "app_name", project.properties['app.name']

        // Generates a build configuration based on the requested features in gradle.properties
        buildConfigField("boolean", "FEATURE_DISPLAY_KEEP_ON", project.properties['display.keep_on'] ?: "false")
        buildConfigField("boolean", "FEATURE_DISPLAY_IMMERSIVE", project.properties['display.immersive'] ?: "false")
        buildConfigField("boolean", "FEATURE_DISPLAY_INTO_CUTOUT", project.properties['display.into_cutout'] ?: "false")
        buildConfigField("int", "DISPLAY_ORIENTATION", project.properties['display.orientation'] ?: "-1")

        // Substitution variables for the manifest
        manifestPlaceholders = [
            'GL_VERSION_CODE': getGLVersionCode(project.properties['gl.version']) ?: "0x00020000",
            'APP_LIB_NAME': project.properties['app.native_library_name'] ?: "raymob",
            'APP_CATEGORY': project.properties['app.category'] ?: "DEFAULT",
            'REQUIRE_INTERNET': project.properties['requirements.internet'] ?: "false",
            'REQUIRE_VIBRATION': project.properties['requirements.vibration'] ?: "false",
            'REQUIRE_GYROSCOPE': project.properties['requirements.gyroscope'] ?: "false",
            'REQUIRE_ACCELEROMETER': project.properties['requirements.accelerometer'] ?: "false"
        ]

        // Give to CMake the name of the library
        externalNativeBuild {
            cmake {
                def nativeLibName = project.findProperty('app.native_library_name') ?: 'raymob'
                def glVersion = project.findProperty('gl.version') ?: 'ES20'

                arguments "-DPLATFORM=Android",
                        "-DBUILD_EXAMPLES=OFF",
                        "-DAPP_LIB_NAME=$nativeLibName",
                        "-DGL_VERSION=$glVersion"
            }
        }
    }

    androidComponents {
        onVariants(selector().all()) { variant ->
            for (output in variant.outputs) {
                def currentName = output.outputFileName.get()
                output.outputFileName.set(currentName.replace("com.raylib.raymob", appId).replace("raymob", libName))
            }
        }
    }

    preBuild.dependsOn("copySharedAssets")

    // Execute the preBuild task before the compilation
    preBuild.doLast {

        // Modify the package name and library name in NativeLoader.java
        updateFile("src/main/java/com/raylib/raymob/LaunchActivity.java", "package com.raylib.raymob;", "package ${appId};")
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "package com.raylib.raymob;", "package ${appId};")
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "System.loadLibrary\\(\"raymob\"\\);", "System.loadLibrary\\(\"${libName}\"\\);")
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "import com.raylib.raymob.bridge.ReviewHelper;", "import ${appId}.bridge.ReviewHelper;")

        // Modify the package name and library name in other java classes
        updateFile("src/main/java/com/raylib/raymob/DisplayManager.java", "package com.raylib.raymob;", "package ${appId};")
        updateFile("src/main/java/com/raylib/raymob/SoftKeyboard.java", "package com.raylib.raymob;", "package ${appId};")
        updateFile("src/main/java/com/raylib/raymob/bridge/ReviewHelper.java", "package com.raylib.raymob.bridge;", "package ${appId}.bridge;")

        // Modify the package name in proguard-rules.pro
        updateFile("proguard-rules.pro", "com.raylib.raymob", appId)

        // Modify the library name in raymob C source
        updateFile("src/main/cpp/raymob/display.c", "com/raylib/raymob", appIdPath)
        updateFile("src/main/cpp/raymob/soft_keyboard.c", "com/raylib/raymob", appIdPath)

    }

    // Execute the postBuild task after the compilation
    gradle.buildFinished {

        // Restore the package name and library name in NativeLoader.java
        updateFile("src/main/java/com/raylib/raymob/LaunchActivity.java", "package ${appId};", "package com.raylib.raymob;")
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "package ${appId};", "package com.raylib.raymob;")
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "System.loadLibrary\\(\"${libName}\"\\);", "System.loadLibrary\\(\"raymob\"\\);")
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "import ${appId}.bridge.ReviewHelper;", "import com.raylib.raymob.bridge.ReviewHelper;")

        // Restore the package name and library name in other java classes
        updateFile("src/main/java/com/raylib/raymob/DisplayManager.java", "package ${appId};", "package com.raylib.raymob;")
        updateFile("src/main/java/com/raylib/raymob/SoftKeyboard.java", "package ${appId};", "package com.raylib.raymob;")
        updateFile("src/main/java/com/raylib/raymob/bridge/ReviewHelper.java", "package ${appId}.bridge;", "package com.raylib.raymob.bridge;")

        // Restore the package name in proguard-rules.pro
        updateFile("proguard-rules.pro", appId, "com.raylib.raymob")

        // Restore the library name in raymob C source
        updateFile("src/main/cpp/raymob/display.c", appIdPath, "com/raylib/raymob")
        updateFile("src/main/cpp/raymob/soft_keyboard.c", appIdPath, "com/raylib/raymob")

    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            debuggable false
            jniDebuggable false
            pseudoLocalesEnabled = false
            zipAlignEnabled true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = '3.30.5'
        }
    }

    buildFeatures {
        resValues = true
        buildConfig = true
        viewBinding = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds true
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        targetExclude 'src/*/java/com/raylib/raymob/*.java'
        googleJavaFormat('1.24.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

dependencies {
    implementation "androidx.core:core-splashscreen:1.0.1"
    implementation "androidx.core:core:1.17.0"
    implementation "com.google.android.play:review:2.0.2"
}
